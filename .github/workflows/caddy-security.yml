name: Caddy security watch

on:
  schedule:
    - cron: '20 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-security-watch
  cancel-in-progress: false

jobs:
  caddy-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --project backend --locked
      # Verified official latest release; a newer release or unavailable lookup fails visibly.
      - run: uv run --project backend python scripts/caddy_image_policy.py
        # Use the ephemeral read-only job token rather than shared anonymous API limits.
        env:
          GH_TOKEN: ${{ github.token }}
      # Fresh vulnerability database, exact accepted findings retained, isolated ACME tests.
      - run: uv run --project backend python scripts/check_caddy_ingress.py
        # Keep authentication limited to the command that performs the upstream lookup.
        env:
          GH_TOKEN: ${{ github.token }}
