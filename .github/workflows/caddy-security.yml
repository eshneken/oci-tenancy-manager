name: Caddy security watch

on:
  schedule:
    - cron: '20 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-security-watch
  cancel-in-progress: false

jobs:
  caddy-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --project backend --locked
      # Verified official latest release; a newer release or unavailable lookup fails visibly.
      - run: uv run --project backend python scripts/caddy_image_policy.py
      # Fresh vulnerability database, exact accepted findings retained, isolated ACME tests.
      - run: uv run --project backend python scripts/check_caddy_ingress.py
