name: Verify application release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build application release run ID to verify
        required: true
        type: string

# Verification has no publication, cloud, environment or deployment authority.
permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
      attestations: read
    steps:
      # Run the protected verifier, never source or commands from the downloaded candidate.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: false
      - run: uv sync --project backend --locked
      # Only ephemeral read credentials; the action logs out during its cleanup step.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and verify exact published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: >-
          uv run --project backend python scripts/verify_application_release.py
          --download --repository "$EXPECTED_REPOSITORY" --run-id "$BUILD_RUN_ID"
