name: Build application release

on:
  workflow_run:
    workflows: [Checkpoint]
    branches: [master]
    types: [completed]

# Publication authority is never supplied to PRs or to the Checkpoint workflow itself.
permissions:
  contents: read

concurrency:
  group: application-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # workflow_run github.sha is master; the gate also requires the tested SHA to equal it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.10'
          enable-cache: false
      - run: uv sync --project backend --locked
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify Checkpoint, build once, scan and publish
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --project backend python scripts/build_application_release.py --output .local-dev/release-output
      - name: Attest application image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.build.outputs.application_name }}
          subject-digest: ${{ steps.build.outputs.application_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest Caddy image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.build.outputs.caddy_name }}
          subject-digest: ${{ steps.build.outputs.caddy_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest application SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.build.outputs.application_name }}
          subject-digest: ${{ steps.build.outputs.application_digest }}
          sbom-path: .local-dev/release-output/application.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest Caddy SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.build.outputs.caddy_name }}
          subject-digest: ${{ steps.build.outputs.caddy_digest }}
          sbom-path: .local-dev/release-output/caddy.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest descriptor and public deployment source
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          # Optional linked-artifact storage records are unnecessary; avoid extra metadata authority.
          create-storage-record: false
          subject-path: |
            .local-dev/release-output/release.json
            .local-dev/release-output/deployment-source.tar
      # Explicit public-file allowlist; never upload image archives, raw logs, caches or workspace.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-release-${{ steps.build.outputs.release_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            .local-dev/release-output/release.json
            .local-dev/release-output/deployment-source.tar
            .local-dev/release-output/application.cdx.json
            .local-dev/release-output/caddy.cdx.json
