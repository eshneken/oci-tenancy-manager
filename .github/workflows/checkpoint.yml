name: Checkpoint

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkpoint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --project backend --locked
      - run: uv run --project backend python scripts/check_unit_coverage.py
      - run: uv run --project backend ruff check --config backend/pyproject.toml backend scripts
      - run: uv run --project backend python scripts/check_inline_docs.py

  frontend-unit:
    name: Frontend unit coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run contracts:check && npm run build
        working-directory: frontend

  integration:
    name: PostgreSQL and Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: uv sync --project backend --locked
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      # The runner owns a disposable loopback database and fails on skipped/missing tests.
      # Backend HTTP tests launch the real app/worker and execute all required UI suites.
      - run: uv run --project backend python scripts/run_backend_postgres_tests.py

  security:
    name: Security and publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: uv sync --project backend --locked
      - run: uv run --project backend python scripts/publication_guard.py
      - run: uv run --project backend python scripts/install_security_tools.py
      - run: uv run --project backend python scripts/check_secrets.py
      - run: uv run --project backend bandit -q -r backend/src/otm
      - run: uv export --project backend --locked --no-dev --no-emit-project --format requirements-txt --output-file .local-dev/runtime-requirements.txt
      - run: uv run --project backend pip-audit -r .local-dev/runtime-requirements.txt
      - run: npm ci --ignore-scripts && npm audit --audit-level=low
        working-directory: frontend
      # Build and scan the installed image; use only uniquely owned disposable resources.
      - run: uv run --project backend python scripts/run_container_smoke.py
      # No logs, DB dumps, browser captures, private inputs or secrets are uploaded as artifacts.

  documentation:
    name: Documentation and contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --project backend --locked
      - run: uv run --project backend python scripts/export_backend_contracts.py --check
      - run: uv run --project backend python scripts/check_design_docs.py
      - run: uv run --no-project scripts/check_c5_contracts.py
      - run: uv run --with jsonschema==4.25.1 --no-project scripts/design/check-execution-contracts.py docs/contracts
      - run: uv run --no-project scripts/design/check-configuration-resolution.py docs/contracts/configuration-examples
      - run: uv run --no-project scripts/design/check-bulk-baseline-gate.py docs/contracts/configuration-examples --resolver scripts/design/check-configuration-resolution.py
