name: Production infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan first; apply consumes one separately reviewed saved plan.
        required: true
        type: choice
        default: plan
        options: [plan, apply]
      plan_run_id:
        description: Successful plan run ID; required only for apply.
        type: string
      reviewed_plan_sha256:
        description: SHA-256 of the privately reviewed binary plan; required only for apply.
        type: string
      staging_apply_run_id:
        description: Successful staging apply of this same source/component; required for apply.
        type: string
      staging_tests_confirmed:
        description: I confirm the referenced staging deployment passed the required tests.
        type: boolean
        default: false
      component:
        description: Existing production Terraform root for a plan or its separately reviewed apply.
        required: true
        type: choice
        options: [security, platform]

permissions:
  contents: read

# Share this exact environment group with future apply/app/settings workflows; no active cancellation.
concurrency:
  group: otm-environment-production
  cancel-in-progress: false

jobs:
  infrastructure:
    name: Infrastructure
    if: github.ref == 'refs/heads/master'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.operation == 'apply' && 90 || 30 }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --project backend --locked
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: '1.15.5'
          terraform_wrapper: false
      - name: Plan or apply reviewed production infrastructure
        env:
          # Read-only job token: trusted production plan and staging apply metadata/logs only.
          GH_TOKEN: ${{ github.token }}
          # Fixed operation choice; no arbitrary command or source ref is accepted.
          OTM_OPERATION: ${{ inputs.operation }}
          # Numeric producer run and reviewed binary hash; no artifact URL or bucket override.
          OTM_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          OTM_REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
          # Successful staging apply plus explicit manual testing confirmation precede production.
          OTM_STAGING_APPLY_RUN_ID: ${{ inputs.staging_apply_run_id }}
          OTM_STAGING_TESTS_CONFIRMED: ${{ inputs.staging_tests_confirmed && 'true' || 'false' }}
          # Separate opt-in; true only after the apply path has been qualified in staging.
          OTM_INFRASTRUCTURE_APPLY_ENABLED: ${{ vars.OTM_INFRASTRUCTURE_APPLY_ENABLED || 'false' }}
          # Enable only after production-specific protection, trust and IAM are qualified.
          OTM_INFRASTRUCTURE_ENABLED: ${{ vars.OTM_INFRASTRUCTURE_ENABLED || 'false' }}
          # Fixed-root choice, never interpolated into executable shell code or file paths.
          OTM_COMPONENT: ${{ inputs.component }}
          # Production's own private inputs/state; never copy staging settings or plan bytes.
          OTM_INFRASTRUCTURE_INPUTS_JSON: ${{ inputs.component == 'security' && secrets.OTM_SECURITY_INPUTS_JSON || secrets.OTM_PLATFORM_INPUTS_JSON }}
          # Restricted production OAuth client; no identity-domain administrator role at runtime.
          OTM_INFRA_IDENTITY_DOMAIN_URL: ${{ secrets.OTM_INFRA_IDENTITY_DOMAIN_URL }}
          # Production exchange client ID: 1-8192 characters without CR/LF, not a bootstrap client.
          OTM_INFRA_CLIENT_ID: ${{ secrets.OTM_INFRA_CLIENT_ID }}
          # Production's matching OAuth credential: 1-8192 characters without CR/LF; never logged.
          OTM_INFRA_CLIENT_SECRET: ${{ secrets.OTM_INFRA_CLIENT_SECRET }}
          # Existing production hosting compartment; this workflow never creates child compartments.
          OTM_HOSTING_COMPARTMENT_OCID: ${{ secrets.OTM_HOSTING_COMPARTMENT_OCID }}
          # Same protected allowlist input feeds application and recovery restrictions.
          OTM_ALLOWED_SOURCE_CIDRS: ${{ secrets.OTM_ALLOWED_SOURCE_CIDRS }}
          # Production uses the reviewed versions and explicit staging-qualified ARM image record.
          OTM_OKE_KUBERNETES_VERSION: ${{ vars.OTM_OKE_KUBERNETES_VERSION }}
          # Same staged/reviewed two-digit PostgreSQL major; platform only, no floating version.
          OTM_POSTGRESQL_VERSION: ${{ vars.OTM_POSTGRESQL_VERSION }}
          # Per-environment private node bootstrap script; never published in logs/artifacts.
          OTM_WORKER_CLOUD_INIT: ${{ secrets.OTM_WORKER_CLOUD_INIT }}
        run: |
          case "$OTM_OPERATION" in
            plan)
              uv run --project backend python -m otm.infrastructure_plan --environment production --component "$OTM_COMPONENT"
              ;;
            apply)
              uv run --project backend python -m otm.infrastructure_apply --environment production --component "$OTM_COMPONENT" --plan-run-id "$OTM_PLAN_RUN_ID" --reviewed-plan-sha256 "$OTM_REVIEWED_PLAN_SHA256" --staging-run-id "$OTM_STAGING_APPLY_RUN_ID" --staging-tests-confirmed "$OTM_STAGING_TESTS_CONFIRMED"
              ;;
            *) exit 2 ;;
          esac
