# Updates propose reviewed pull requests; they never merge or deploy automatically.
version: 2
updates:
  # One reviewed proposal keeps the shared provider and both environment locks aligned.
  - package-ecosystem: terraform
    directories:
      - /infra/modules/state-bootstrap
      - /infra/environments/staging/bootstrap
      - /infra/environments/production/bootstrap
      - /infra/modules/secret-foundation
      - /infra/environments/staging/security
      - /infra/environments/production/security
      - /infra/modules/postgresql
      - /infra/modules/oke
      - /infra/modules/networking
      - /infra/modules/workload-vault-access
      - /infra/environments/development/bootstrap
      - /infra/environments/development/infrastructure
      - /infra/environments/staging/platform
      - /infra/environments/production/platform
    schedule:
      interval: weekly
      day: monday
      time: '11:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      terraform-providers:
        patterns: ['*']
  # One grouped weekly PR covers application build/runtime images and the scanner engine pin.
  - package-ecosystem: docker
    directories:
      - /
      - /tools/trivy
      - /tools/kubeconform
      - /tools/caddy
      - /tools/pebble
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ['*']
    ignore:
      # Python3.12 is an application compatibility contract; upgrade its release line deliberately.
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # Keep the selected Node major; digest refreshes still track updates of its existing tag.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  # Pin updates for the open-source actions used by the hosted CI service are reviewed together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '10:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      ci-actions:
        patterns: ['*']
