[project]
name = "otm-backend"
version = "0.1.0"
description = "OCI Tenancy Manager production backend foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "fastapi==0.143.0",
  "procrastinate==3.10.0",
  "psycopg[binary,pool]==3.3.6",
  "pydantic==2.14.1",
  "pyotp==2.9.0",
  "sqlalchemy==2.0.54",
  "uvicorn==0.54.0",
]

[project.scripts]
otm-validate-release = "otm.release_validation:main"
otm-simulation-worker = "otm.local_worker:main"
otm-local = "otm.local_development:main"
otm-admin = "otm.admin_cli:main"
otm-maintenance = "otm.maintenance:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "coverage==7.17.0",
  "httpx==0.28.1",
  "ruff==0.17.0",
  "defusedxml==0.7.1",
  "hatchling==1.33.0",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otm"]

# Deploy the frozen migration assets alongside the package; never bundle local environments.
[tool.hatch.build.targets.wheel.force-include]
"migrations/versions/0024_user_presence_connections.py" = "otm_migrations/migrations/versions/0024_user_presence_connections.py"
"migrations/sql/0024-user-presence-connections.sql" = "otm_migrations/migrations/sql/0024-user-presence-connections.sql"
"migrations/versions/0021_financial_collection.py" = "otm_migrations/migrations/versions/0021_financial_collection.py"
"migrations/sql/0021-financial-collection.sql" = "otm_migrations/migrations/sql/0021-financial-collection.sql"
"migrations/versions/0022_onboarding_users.py" = "otm_migrations/migrations/versions/0022_onboarding_users.py"
"migrations/sql/0022-onboarding-users.sql" = "otm_migrations/migrations/sql/0022-onboarding-users.sql"
"migrations/versions/0023_managed_identity_bindings.py" = "otm_migrations/migrations/versions/0023_managed_identity_bindings.py"
"migrations/sql/0023-managed-identity-bindings.sql" = "otm_migrations/migrations/sql/0023-managed-identity-bindings.sql"
"migrations/versions/0020_email_delivery.py" = "otm_migrations/migrations/versions/0020_email_delivery.py"
"migrations/sql/0020-email-delivery.sql" = "otm_migrations/migrations/sql/0020-email-delivery.sql"
"migrations/versions/0019_operation_responsibility.py" = "otm_migrations/migrations/versions/0019_operation_responsibility.py"
"migrations/sql/0019-operation-responsibility.sql" = "otm_migrations/migrations/sql/0019-operation-responsibility.sql"
"migrations/versions/0018_configuration_drift.py" = "otm_migrations/migrations/versions/0018_configuration_drift.py"
"migrations/sql/0018-configuration-drift.sql" = "otm_migrations/migrations/sql/0018-configuration-drift.sql"
"migrations/versions/0017_membership_onboarding.py" = "otm_migrations/migrations/versions/0017_membership_onboarding.py"
"migrations/sql/0017-membership-onboarding.sql" = "otm_migrations/migrations/sql/0017-membership-onboarding.sql"
"migrations/versions/0016_tenancy_overrides.py" = "otm_migrations/migrations/versions/0016_tenancy_overrides.py"
"migrations/sql/0016-tenancy-overrides.sql" = "otm_migrations/migrations/sql/0016-tenancy-overrides.sql"
"migrations/versions/0011_baseline_drafts.py" = "otm_migrations/migrations/versions/0011_baseline_drafts.py"
"migrations/versions/0012_baseline_publication.py" = "otm_migrations/migrations/versions/0012_baseline_publication.py"
"migrations/versions/0013_baseline_pinning.py" = "otm_migrations/migrations/versions/0013_baseline_pinning.py"
"migrations/versions/0014_latest_baseline.py" = "otm_migrations/migrations/versions/0014_latest_baseline.py"
"migrations/versions/0015_configuration_updates.py" = "otm_migrations/migrations/versions/0015_configuration_updates.py"
"migrations/sql/0011-baseline-drafts.sql" = "otm_migrations/migrations/sql/0011-baseline-drafts.sql"
"migrations/sql/0012-baseline-publication.sql" = "otm_migrations/migrations/sql/0012-baseline-publication.sql"
"migrations/sql/0013-baseline-pinning.sql" = "otm_migrations/migrations/sql/0013-baseline-pinning.sql"
"migrations/sql/0014-latest-baseline.sql" = "otm_migrations/migrations/sql/0014-latest-baseline.sql"
"migrations/sql/0015-configuration-updates.sql" = "otm_migrations/migrations/sql/0015-configuration-updates.sql"
"migrations/versions/0010_guided_onboarding.py" = "otm_migrations/migrations/versions/0010_guided_onboarding.py"
"migrations/sql/0010-guided-onboarding.sql" = "otm_migrations/migrations/sql/0010-guided-onboarding.sql"
"migrations/versions/0009_organization_workflows.py" = "otm_migrations/migrations/versions/0009_organization_workflows.py"
"migrations/sql/0009-organization-workflows.sql" = "otm_migrations/migrations/sql/0009-organization-workflows.sql"
"migrations/versions/0008_organization_snapshots.py" = "otm_migrations/migrations/versions/0008_organization_snapshots.py"
"migrations/sql/0008-organization-snapshots.sql" = "otm_migrations/migrations/sql/0008-organization-snapshots.sql"
