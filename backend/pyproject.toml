"migrations/env.py" = "otm_migrations/migrations/env.py"
"config/application.toml" = "otm_settings/application.toml"
"migrations/versions/0006_local_authentication.py" = "otm_migrations/migrations/versions/0006_local_authentication.py"
"migrations/sql/0006-local-authentication.sql" = "otm_migrations/migrations/sql/0006-local-authentication.sql"
"migrations/versions/0005_administrator_grants.py" = "otm_migrations/migrations/versions/0005_administrator_grants.py"
"migrations/sql/0005-administrator-grants.sql" = "otm_migrations/migrations/sql/0005-administrator-grants.sql"
"migrations/versions/0004_session_idle_policy.py" = "otm_migrations/migrations/versions/0004_session_idle_policy.py"
"migrations/sql/0004-session-idle-policy.sql" = "otm_migrations/migrations/sql/0004-session-idle-policy.sql"
"migrations/versions/0003_admin_session.py" = "otm_migrations/migrations/versions/0003_admin_session.py"
"migrations/sql/0003-admin-session.sql" = "otm_migrations/migrations/sql/0003-admin-session.sql"
"migrations/versions/0002_inspection_worker.py" = "otm_migrations/migrations/versions/0002_inspection_worker.py"
"migrations/sql/0002-inspection-worker.sql" = "otm_migrations/migrations/sql/0002-inspection-worker.sql"
"migrations/versions/0001_operation_admission.py" = "otm_migrations/migrations/versions/0001_operation_admission.py"
"migrations/sql/0001-application.sql" = "otm_migrations/migrations/sql/0001-application.sql"
"migrations/sql/procrastinate-3.10.0.sql" = "otm_migrations/migrations/sql/procrastinate-3.10.0.sql"
"migrations/sql/procrastinate-LICENSE.md" = "otm_migrations/migrations/sql/procrastinate-LICENSE.md"
"migrations/sql/manifest.json" = "otm_migrations/migrations/sql/manifest.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable local PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["otm"]

[tool.coverage.run]
source = ["src/otm"]
branch = true
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = []

[tool.uv]
constraint-dependencies = ["certifi>=2026.10.19"]
