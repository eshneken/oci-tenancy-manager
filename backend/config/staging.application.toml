# Nonsecret application settings; operator-reviewed per deployment target.
# Trusted release target must independently match this environment.
environment = "staging"
# Supported settings schema version; exactly 1.
schema_version = 1

[sessions]
# Idle session lifetime in seconds.
idle_timeout_seconds = 1800
# Maximum session lifetime in seconds.
absolute_timeout_seconds = 28800
[sessions.cleanup]
# Daily UTC cleanup hour.
hour_utc = 2
# Daily UTC cleanup minute.
minute_utc = 0
# Maximum deleted sessions per transaction.
batch_size = 500
# Maximum transactions per cleanup invocation.
max_batches = 20

[notifications]
# Explicitly enable after qualifying SMTP secret custody and deployment composition.
enabled = false
# Replace with your approved TLS-capable delivery service DNS name.
smtp_host = "smtp.example.test"
# STARTTLS SMTP port; never expose a local capture endpoint in hosted deployments.
smtp_port = 587
# Replace with the organization-approved sender mailbox.
sender_email = "no-reply@example.test"
# Hosted delivery requires verified TLS.
tls_mode = "starttls"
# Replace with the trusted HTTPS application origin; links never derive from browser headers.
application_origin = "https://otm.example.test"
# Authenticated SMTP requires both username and a separately managed password_secret_reference.
# No actual credential values belong in this document or CI artifacts.

[testing]
# Required single destination; replace with the testing administrator's controlled mailbox.
email_override = "testing-admin@example.test"

# Hosted entry-point policy; replace example origin and proxy CIDRs before deployment.
[hosted]
# Trusted public HTTPS origin; must match notification application_origin when supplied.
public_origin = "https://otm.example.test"
# Only actual ingress proxy source networks may supply forwarded headers; no universal trust.
trusted_proxy_cidrs = ["192.0.2.0/24"]
# Per-process SQLAlchemy pool,1-16 connections, no overflow; native worker adds at most2.
database_pool_size = 2
# Worker drain1-240 seconds, below Kubernetes worker termination grace300 seconds.
worker_shutdown_seconds = 120

[hosted.organization_source]
# Deployment-owned source identifier, 1–256 nonblank characters, stable across imports.
source_id = "manual-directory-csv"
# Deployment-scoped population identifier, 1–256 nonblank characters, stable across imports.
population_id = "staging-directory"
# Source age limit, 1–2147483647 seconds; 86400 accepts exports up to 24 hours old.
max_age_seconds = 86400
# Set true only after approving this source as a complete census eligible for absence review.
census_contract_confirmed = false
# Alert routing uses the required testing.email_override from this same profile.
