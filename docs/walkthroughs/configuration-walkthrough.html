function tenancyDetail(){const person=people.find(p=>p.id===state.params.get('tenancy'));if(!person)return notFound('Tenancy not found','tenancies');const v=section(person.tenancy,'Tenancy configuration · '+person.type);const costsLink=el('a','View costs','button');costsLink.href='financial-walkthrough.html#tenancy?tenancy='+person.id;v.append(costsLink);const p=panel('Tenancy details');p.append(properties([['Owner',person.name],['LOB','Platform Engineering'],['Assigned baseline','v1'],['Current for new',state.currentForNew+' · a newer available version alone is not drift'],['Monthly root budget',assigned(person,'budget')+' USD'],['Recorded overrides',Object.keys(person.overrides).join(', ')||'None']]));p.append(actions(button(Object.keys(person.overrides).length?'Edit tenancy override':'Create tenancy override',()=>show('overlay?tenancy='+person.id+'&return='+encodeURIComponent('tenancy?tenancy='+person.id)),'primary'),button('Back to tenancies',()=>show('tenancies'))));v.append(p);const observed=panel('Configuration issues');const rows=tenancyIssues(person.id);if(!rows.length)observed.append(note('No detected configuration issues in the sample observation. This is not a fresh OCI verification.','hint'));for(const issue of rows){const row=el('div',undefined,'exception');row.append(link(issue.title,'issue?issue='+issue.id),el('span',issue.status,'statuswarn'));observed.append(row);}v.append(observed,requiredPolicyPanel(person),policyPreview(person,assigned(person,'policy')));if(person.id==='casey'){const access=panel('Required access');const a=el('a','View required access','button');a.href='access-walkthrough.html#missing';access.append(el('p','Inspect automation and emergency recovery identities, current evidence and repair availability.'),a);v.append(access);}return v;}
/** Show only actual observed configuration-attention records, with an optional stable tenancy filter. */
function drift(){const filter=state.params.get('tenancy'),person=people.find(p=>p.id===filter);const rows=issues.filter(i=>i.verified&&(!filter||i.person===filter));const v=section('Configuration drift',person?'Detected issues for '+person.tenancy+'. Baseline update reviews are separate.':'Confirmed missing or different configuration only. Version age, unverified checks and baseline-update reviews are not drift.');const p=panel(person?'Issues · '+person.name:'Detected issues');if(filter)p.append(actions(button('Show all configuration issues',()=>show('drift'))));if(!rows.length)p.append(el('div','No detected configuration issues for this tenancy.','empty'));for(const issue of rows){const person=people.find(p=>p.id===issue.person),row=el('div',undefined,'exception'),text=el('div');text.append(link(issue.title,'issue?issue='+issue.id),el('p',person.tenancy+' · '+person.name),el('p',issue.time));if(!issue.verified)text.append(el('p','Needs attention: configuration is unknown because access could not be verified.'));row.append(text,el('span',issue.status,'statuswarn'));p.append(row);}v.append(p);return v;}
/** Show all issues counted by one tenancy badge, including check failures without classifying them as confirmed drift. */
function tenancyIssueList(){const person=people.find(p=>p.id===state.params.get('tenancy'));if(!person)return notFound('Tenancy not found','tenancies');const v=section('Configuration issues · '+person.tenancy,'All recorded configuration issues for '+person.name+'. Unverified checks are attention items, not confirmed drift.');const p=panel('Tenancy issues');const rows=tenancyIssues(person.id);if(!rows.length)p.append(el('div','No detected configuration issues for this tenancy.','empty'));for(const issue of rows){const row=el('div',undefined,'exception'),text=el('div');text.append(link(issue.title,'issue?issue='+issue.id),el('p',issue.time));if(!issue.verified)text.append(el('p','Check issue: access could not be verified. Configuration is unknown.'));row.append(text,el('span',issue.status,'statuswarn'));p.append(row);}p.append(actions(button('View tenancy',()=>show('tenancy?tenancy='+person.id)),button('Back to tenancies',()=>show('tenancies'))));v.append(p);return v;}
/** Compare the assigned effective expectation with one observed result; unverified access never exposes Repair. */
function issueDetail(){const issue=issues.find(i=>i.id===state.params.get('issue'));if(!issue)return notFound('Configuration issue not found','drift');const person=people.find(p=>p.id===issue.person);const v=section(issue.title,person.tenancy+' · '+person.name);const p=panel('Observed issue');p.append(properties([['Finding',issue.status],['Observed',issue.time],['Assigned baseline','v1'],['Expected source',issue.kind==='policy'?'Assigned v1 / authored override + captured required-access manifest':person.overrides[issue.kind]!==undefined?'v1 plus recorded tenancy override':'Assigned v1 baseline'],['Repair authority',issue.repairEligible?'Qualified repair-profile evidence (sample)':issue.verified?'Repair profile not qualified · no automated repair':'Unable to verify · no automated repair']]));const grid=el('div',undefined,'grid2'),expected=el('div'),actual=el('div');const value=issue.kind==='policy'?combinedPolicy(person,assigned(person,'policy')):assigned(person,issue.kind);expected.append(el('h3','Expected assigned configuration'),el('pre',Array.isArray(value)?value.join('\n'):value+' USD · root scope · monthly · no alert rules','blockpre'));actual.append(el('h3','Observed configuration'),el('pre',issue.observed,'blockpre'));grid.append(expected,actual);p.append(grid);if(issue.kind==='policy')p.append(requiredPolicyPanel(person));if(issue.repairEligible){const result=el('p','', 'notice');result.id='repair-result';result.hidden=true;result.tabIndex=-1;result.setAttribute('role','status');p.append(actions(button('Preview repair',()=>{result.textContent='Local repair preview only: restore the expected assigned configuration in the bound managed object. No repair was queued or performed.';result.hidden=false;result.focus();},'primary')),result);}else p.append(note(issue.verified?'Confirmed configuration drift remains open. Repair is unavailable until separate current qualified repair-profile evidence is recorded. An authenticated read alone does not authorize repair.':'Repair is unavailable until automation access can be verified. Investigate access before deciding whether this configuration is missing or different.','hint'));p.append(actions(...(issue.verified?[button('Back to this tenancy’s issues',()=>show('tenancy-issues?tenancy='+person.id))]:[]),button('View tenancy',()=>show('tenancy?tenancy='+person.id))));v.append(p);return v;}
/** Keep the organization directory and its drift reviews separate from OCI configuration issues. */
function organization(){return section('Organization','Layout placeholder only. The approved organization prototype is the source of truth for this screen; this walkthrough does not define organization data or layout.');}
/** Keep legacy organization-drift links explicit about the approved prototype rather than inventing a replacement screen. */
function organizationDrift(){return section('Organization drift','Layout placeholder only. The approved organization prototype is the source of truth for organization drift; no replacement drift screen is defined here.');}
/** Select the shared menu context without exposing organization placeholders as navigable destinations. */
function renderNavigation(){let context='baselines';if(['tenancies','tenancy','tenancy-issues'].includes(state.route))context='tenancies';else if(['organization','organization-drift'].includes(state.route))context=state.route;else if(state.route==='operation')context='operations';else if(state.route==='drift')context='configuration-drift';else if(state.route==='issue')context=issues.find(i=>i.id===state.params.get('issue'))?.verified?'configuration-drift':'tenancies';DesignNavigation.render('design-navigation',context);}
/** Parse route context into the URL so a reload can reopen the same seeded tenancy or issue without browser storage. */
function show(locationName,focus=true){const [routeName,query='']=locationName.split('?');if(routeName==='tenancies'){location.replace('financial-walkthrough.html#tenancies');return;}const views={configurations,baseline,published,rollout,review,overlay,operation,version:versionDetail,'override-chooser':overrideChooser,tenancy:tenancyDetail,'tenancy-issues':tenancyIssueList,drift,issue:issueDetail,organization,'organization-drift':organizationDrift};const aliases={employees:'organization','organization-exceptions':'organization-drift'};const requestedRoute=aliases[routeName]||routeName;const route=views[requestedRoute]?requestedRoute:'configurations';state.route=route;state.params=new URLSearchParams(query);if(route==='overlay'){state.reviewPerson=state.params.get('tenancy')||state.reviewPerson||'casey';state.overrideReturn=state.params.get('return')||'configurations';}const view=views[route]();$('view').replaceChildren(view);if(state.flash){view.querySelector('h1').after(note(state.flash));state.flash=null;}renderNavigation();history.replaceState(null,'','#'+route+(query?'?'+query:''));const heading=$('view').querySelector('h1');$('announcement').textContent=heading?.textContent||'';if(focus)heading?.focus({preventScroll:true});window.scrollTo(0,0);}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)||'configurations'));show(location.hash.slice(1)||'configurations',false);
</script></body></html>
